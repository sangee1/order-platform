server:
  port: 8080

spring:
  application:
    name: order-service
  threads:
    virtual:
      enabled: true            # Java 21 virtual threads for request handling and Kafka listeners
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USER:orders}
    password: ${DB_PASSWORD:orders}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate       # Flyway owns the schema; Hibernate only verifies it
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

outbox:
  publisher:
    enabled: true
    poll-interval-ms: 500
    batch-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

saga:
  sweeper:
    enabled: true
    interval-ms: 15000
    batch-size: 50
  timeout:                      # time an order may sit in a state before recovery acts
    pending: PT2M               # waiting for stock
    payment: PT1M               # waiting for payment (re-requested up to max-payment-attempts)
    cancelling: PT1M            # waiting for stock release (re-sent until acknowledged)
    max-payment-attempts: 3
