server:
  port: 8082

spring:
  application:
    name: payment-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${DB_USER:payments}
    password: ${DB_PASSWORD:payments}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

outbox:
  publisher:
    enabled: true
    poll-interval-ms: 500
    batch-size: 100

# Mock payment gateway behaviour (demo/testing)
payment:
  mock:
    decline-above: 1000.00     # amounts above this are always declined: deterministic way to demo compensation
    failure-rate: 0.0          # 0..1 chance of a random decline for amounts under the limit

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
