server:
  port: 8082

spring:
  application:
    name: payment-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${DB_USER:payments}
    password: ${DB_PASSWORD:payments}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      observation-enabled: true    # consumer spans + trace propagation via headers
    template:
      observation-enabled: true    # producer spans

outbox:
  publisher:
    enabled: true
    poll-interval-ms: 500
    batch-size: 100

payment:
  gateway:
    timeout: PT2S                 # per-attempt timeout for a gateway call
  mock:                           # behaviour of the mock gateway (demo/testing only)
    decline-above: 1000.00        # business decline: amounts above this are always declined
    failure-rate: 0.0             # business decline: random chance for amounts under the limit
    transient-failure-rate: 0.0   # technical failure (like HTTP 503): chance a call throws. Change live via /api/admin/gateway
    latency-ms: 0                 # artificial latency per call. Change live via /api/admin/gateway

# Fault tolerance for the payment gateway. Only technical failures (PaymentGatewayException) are
# retried and counted by the breaker; a card decline is a normal business answer, not a failure.
resilience4j:
  retry:
    instances:
      paymentGateway:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.example.platform.payment.gateway.PaymentGatewayException
  circuitbreaker:
    instances:
      paymentGateway:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.example.platform.payment.gateway.PaymentGatewayException
  bulkhead:
    instances:
      paymentGateway:
        max-concurrent-calls: 10
        max-wait-duration: 0

management:
  tracing:
    sampling:
      probability: 1.0                 # sample every request (demo); lower this in production
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces   # overridden in docker compose
  metrics:
    tags:
      application: ${spring.application.name}     # lets dashboards split by service
    distribution:
      percentiles-histogram:
        http.server.requests: true                # enables p95/p99 latency queries
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents

logging:
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-}] "   # trace ids in every log line
