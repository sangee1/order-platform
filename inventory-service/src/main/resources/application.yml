server:
  port: 8081

spring:
  application:
    name: inventory-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: inventory-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      observation-enabled: true    # consumer spans + trace propagation via headers
    template:
      observation-enabled: true    # producer spans

outbox:
  publisher:
    enabled: true
    poll-interval-ms: 500
    batch-size: 100

reservation:
  max-attempts: 50             # optimistic-lock retries before giving up (message then goes to retry/DLT)

management:
  tracing:
    sampling:
      probability: 1.0                 # sample every request (demo); lower this in production
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces   # overridden in docker compose
  metrics:
    tags:
      application: ${spring.application.name}     # lets dashboards split by service
    distribution:
      percentiles-histogram:
        http.server.requests: true                # enables p95/p99 latency queries
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-}] "   # trace ids in every log line
